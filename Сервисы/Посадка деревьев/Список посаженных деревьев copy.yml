info:
  name: Список посаженных деревьев copy
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/task/web/tree/tree?page=1&page_size=10"
  headers:
    - name: Authorization
      value: Bearer {{staff_token}}
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "10"
      type: query
    - name: status
      value: CREATED
      type: query
      disabled: true
    - name: status
      value: APPROVED
      type: query
      disabled: true
    - name: status
      value: REJECTED
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
