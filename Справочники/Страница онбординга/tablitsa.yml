info:
  name: tablitsa
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/directory/web/on_boarding/get_table_on_boarding?page=1&page_size=10"
  headers:
    - name: Authorization
      value: "{{staff_token}}"
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
