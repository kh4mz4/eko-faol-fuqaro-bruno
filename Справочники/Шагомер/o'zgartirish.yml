http:
  method: PATCH
  url: "{{base_url}}/directory/web/step/update_step/{{step_uuid}}"
  headers:
    - name: Authorization
      value: Bearer {{staff_token}}
  body:
    type: json
    data: |-
      {
        "count": 10,
        "point": 10
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
