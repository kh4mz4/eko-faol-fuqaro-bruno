info:
  name: get
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/directory/web/privacy_policy/get_privacy_policy?page=1&page_size=10"
  headers:
    - name: Authorization
      value: Bearer {{staff_token}}
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
