info:
  name: News GET detail
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/notification/web/news/get_news/{{uuid}}"
  headers:
    - name: Authorization
      value: Bearer {{staff_token}}
  body:
    type: multipart-form
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
