info:
  name: SMS Campaign detail
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/notification/web/sms_campaign/get_sms_campaign/{{uuid}}"
  headers:
    - name: Authorization
      value: Bearer {{staff_token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
