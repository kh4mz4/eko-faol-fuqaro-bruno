info:
  name: Delete Event
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/notification/web/events/delete_event/{{uuid}}"
  headers:
    - name: Authorization
      value: Bearer {{staff_token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
