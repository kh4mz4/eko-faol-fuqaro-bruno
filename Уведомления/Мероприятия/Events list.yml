info:
  name: Events list
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/notification/web/events/get_table_events?page=1&page_size=10"
  headers:
    - name: Authorization
      value: Bearer {{staff_token}}
  params:
    - name: search
      value: Hi
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
