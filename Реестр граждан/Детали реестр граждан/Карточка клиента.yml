info:
  name: Карточка клиента
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/client/web/client/get_client_info/{{client_uuid}}"
  headers:
    - name: Authorization
      value: Bearer {{staff_token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
